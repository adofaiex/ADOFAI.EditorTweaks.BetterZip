<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>BetterZip 使用手册</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 24px;line-height:1.7;background:#10151d;color:#e9eef5}h1,h2{color:#72e0bd}.card{border:1px solid #334354;padding:18px;margin:16px 0;border-radius:8px}</style></head><body>
<h1>ADOFAI.EditorTweaks.BetterZip</h1><p>独立的谱面压缩包处理 Mod。</p>
<div class="card"><h2>支持内容</h2><p>ZIP、ADOZIP、7z、RAR、TAR、GZip、BZip2、XZ、CAB，以及旧 ZIP 文件名编码。</p></div>
<div class="card"><h2>编码设置</h2><p>在 UMM 面板选择 Auto、CP949、GB18030、Shift-JIS 或 CP437。压缩包会执行路径穿越、重复文件和覆盖保护。</p></div>
</body></html>
